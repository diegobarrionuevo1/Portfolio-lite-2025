name: Daily blog post

on:
  schedule:
    # 12:00 UTC = 09:00 America/Argentina/Buenos_Aires (UTC-3, no DST).
    - cron: "0 12 * * *"
  workflow_dispatch:

# The job commits automation/state/covered.json back to the repo, so two
# overlapping runs would race on the same file. Never cancel an in-flight run:
# it may already have created a Ghost post.
concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        # Full history: the state commit below rebases onto origin, and a
        # depth-1 clone has no merge base to rebase against.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Required: package.json has no `packageManager` field, and without
          # either one this step fails before anything else runs.
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily pipeline
        env:
          GHOST_URL: ${{ secrets.GHOST_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          BLOG_AUTO_PUBLISH: ${{ secrets.BLOG_AUTO_PUBLISH }}
        run: pnpm blog:daily

      - name: Commit dedup state
        # `always()`: if the pipeline created the Ghost post and then died, the
        # state file on disk is the only record of it. Skipping this step there
        # would leave the story unmarked and let tomorrow's run write it again.
        # `git diff --quiet` makes "nothing to commit" a no-op, not a failure.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state/covered.json
          if git diff --cached --quiet; then
            echo "No hay cambios en automation/state/covered.json."
            exit 0
          fi
          git commit -m "chore(blog): update covered sources [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
