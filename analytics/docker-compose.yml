# Self-hosted Umami: per-post metrics with an API we can actually query.
#
#   docker compose -f analytics/docker-compose.yml up -d
#   open http://localhost:3000   (first run: admin / umami — change it immediately)
#
# Why this and not Ghost's own analytics: Ghost counts readers by serving them,
# and it never serves anyone here. Why this and not only Vercel's dashboard:
# the numbers have to be readable by a script, so the weekly audit can join them
# against each post's tags and source instead of a human squinting at a chart.
#
# Unlike the Ghost container, this one has a part that MUST be reachable from a
# reader's browser — the tracking script and its /api/send endpoint. The admin
# UI and the reporting API should not be.
services:
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: portfolio-umami
    restart: unless-stopped
    environment:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?falta UMAMI_DB_PASSWORD}@db:5432/umami
      # Signs sessions and hashes visitor identifiers. Changing it logs everyone
      # out and breaks the salt used for returning-visitor detection, so set it
      # once and keep it: openssl rand -hex 32
      APP_SECRET: ${UMAMI_APP_SECRET:?falta UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${UMAMI_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: portfolio-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?falta UMAMI_DB_PASSWORD}
    volumes:
      - umami_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # Every metric ever collected lives here. Back it up with ghost_data.
  umami_db:
