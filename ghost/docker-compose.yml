# Local Ghost instance used as the headless CMS for the blog.
#
#   docker compose -f ghost/docker-compose.yml up -d
#   open http://localhost:2368/ghost   (first run: create the owner account)
#
# Then create the API keys in Ghost admin under Settings → Integrations →
# "Add custom integration", and copy them into .env.local (see .env.example).
#
# The same file works on a server: set GHOST_URL to the public URL and put it
# behind a reverse proxy with TLS.
services:
  ghost:
    image: ghost:5-alpine
    container_name: portfolio-ghost
    restart: unless-stopped
    environment:
      url: ${GHOST_URL:-http://localhost:2368}
      NODE_ENV: production
      # SQLite keeps this a single container — no external database to run.
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      # Outbound mail is optional; Ghost only needs it for staff invites.
      mail__transport: SMTP
      mail__options__host: ${GHOST_SMTP_HOST:-}
      mail__options__port: ${GHOST_SMTP_PORT:-587}
      mail__options__secure: ${GHOST_SMTP_SECURE:-false}
      mail__options__auth__user: ${GHOST_SMTP_USER:-}
      mail__options__auth__pass: ${GHOST_SMTP_PASS:-}
      mail__from: ${GHOST_SMTP_FROM:-}
    volumes:
      - ghost_data:/var/lib/ghost/content
    ports:
      - "${GHOST_PORT:-2368}:2368"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2368/ghost/api/admin/site/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  ghost_data:
